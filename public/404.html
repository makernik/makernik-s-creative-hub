<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>makernik | Digital & Physical Maker</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a path portion and then redirects the browser
      // to that new path.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <script>
      // Redirect to index.html with the current path
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var url = path + (search ? search : '') + (hash ? hash : '');
      window.location.replace('/' + url.replace(/^\//, ''));
    </script>
  </body>
</html>
